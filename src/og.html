<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;background:#0c0c0e;color:#f2efe8;font-family:'Bricolage Grotesque';position:relative}
.c{position:absolute;left:80px;top:64px;right:80px}
.top{display:flex;gap:18px;align-items:center;font-family:'IBM Plex Mono';font-size:20px;color:#a09d95}
.st{display:inline-flex;align-items:center;gap:10px;border:1px solid rgba(255,255,255,.2);border-radius:99px;padding:8px 18px;color:#f2efe8;font-family:'Bricolage Grotesque';font-weight:500}
.st i{width:11px;height:11px;border-radius:50%;background:#d4ff3a}
h1{font-weight:600;font-size:84px;letter-spacing:-.045em;line-height:1;margin-top:44px}
em{display:block;font-family:'Instrument Serif';font-style:italic;font-weight:400;color:#d4ff3a;letter-spacing:-.01em}
.foot{position:absolute;left:80px;right:80px;bottom:60px;display:flex;justify-content:space-between;align-items:center;padding-top:28px;border-top:1px solid rgba(255,255,255,.16)}
.name{font-size:30px;font-weight:600;display:flex;align-items:center;gap:14px}.name i{width:14px;height:14px;border-radius:50%;background:#d4ff3a}
.name small{font-size:22px;font-weight:500;color:#a09d95}
.live{font-family:'IBM Plex Mono';font-size:19px;color:#a09d95}
</style></head><body>
<div class="c">
  <div class="top"><span class="st"><i></i>Open to product design roles</span>NIT Kurukshetra '26</div>

</div>
<div class="foot"><span class="name"><i></i>Vivek Poddar <small>· Product & UI/UX designer</small></span><span class="live">4 live products · case studies</span></div>
